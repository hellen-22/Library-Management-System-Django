name: Pre-commit Checks

on:
  pull_request: {}

jobs:
  pft-ci-pre-commit:
    name: 'Check Pre-commit'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v3
        with:
          python-version: '3.11'
      - uses: pre-commit/action@v3.0.0
